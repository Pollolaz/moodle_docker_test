services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  moodle:
    build:
      context: ./docker/moodle
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata

  cron:
    build:
      context: ./docker/moodle
    restart: unless-stopped
    depends_on:
      - moodle
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php /var/www/html/admin/cli/cron.php
          sleep 60
        done

volumes:
  db_data:
